model: qwen_audio_model
model_conf:
  aux_loss_weight: 0.1
  model_repo: "moonshotai/Kimi-Audio-7B-Instruct"
  tokenizer_repo: "THUDM/glm-4-voice-tokenizer"
  sample_rate: 16000
  adapter_type: moe
  decoder_type: qwen
  freeze_frontend: false
  adapter_conf:
    expert_ffn_dim: 1280
    num_experts: 8
    top_k: 4
  llm_decoder_conf:
    llm_repo: "Qwen/Qwen3-1.7B"
    projector_hidden_dim: 2048
    projector_num_layers: 2
    dropout: 0.1
    max_target_length: 128
    prompt_text: ""

optimizer: adamw
optimizer_conf:
  lr: 1.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.95
  weight_decay: 0.01
                    
scheduler: cosineannealinglr
scheduler_conf:
  interval: step
  frequency: 1
  eta_min: 0.00004


token_type: huggingface
token_list: Qwen/Qwen3-1.7B

ngpu: 1
patience: 1
seed: 314562
epoch: 5
log_every_n_steps: 500
precision: 32-true
accum_grad: 64
grad_clip: 5.0
grad_clip_algorithm: norm
strategy: ddp
strategy_conf:
  find_unused_parameters: false
  gradient_as_bucket_view: true
task: instruction
use_tensorboard: true
best_model_criterion:
  - ["valid/lm_loss", "min", 3]

dataset_conf:
  train_data: chime4/tr05_all_noisy
  train_shape_file:
    - data/chime4/tr05_all_noisy/shape/instruction_fused_shape
  valid_data: chime4/dt05_multi_isolated_1ch_track
  valid_shape_file:
    - data/chime4/dt05_multi_isolated_1ch_track/shape/instruction_fused_shape
  batch_type: numel
  batch_bins: 4000000
  sort_in_batch: descending
  sort_batch: descending
  shuffle_within_batch: true
  data_type: [fused, audio_context, answer]
  instruction_source: task_specs
  instruction_tasks:
    - name: asr
      prompt: "Transcribe the following speech:"
      answer_field: text
      scoring: [wer, cer]

    - name: environment
      prompt: "Classify the environment of this audio:"
      answer_field: environment
      scoring: [acc]
      labels: [BUS, CAFE, PEDESTRIAN, STREET]

    - name: gender
      prompt: "Classify the speaker's gender, male or female:"
      answer_field: Gender
      scoring: [acc]
      labels: [female, male]

  num_workers: 4
