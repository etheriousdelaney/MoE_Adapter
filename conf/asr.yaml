model: asr_model
model_conf:
  aux_loss_weight: 0.1
  model_repo: "moonshotai/Kimi-Audio-7B-Instruct"
  tokenizer_repo: "THUDM/glm-4-voice-tokenizer"
  sample_rate: 16000
  adapter_conf:
    expert_ffn_dim: 1280
    num_experts: 8
    top_k: 4
  asr_decoder_conf:
    dropout: 0.1

optimizer_conf:
  adam_beta1: 0.9
  adam_beta2: 0.95
  lr: 0.00001
  warmup_steps: 20
  stable_steps: 0
  min_lr_ratio: 0.1

token_type: char
token_list: conf/chime4_char_tokens.txt

seed: 314562
epoch: 10
log_every_n_steps: 500
task: asr
use_tensorboard: true

dataset_conf:
  train_data: chime4/tr05_all_noisy
  train_shape_file:
    - data/chime4/tr05_all_noisy/shape/speech_shape
  valid_data: chime4/dt05_multi_isolated_1ch_track
  valid_shape_file:
    - data/chime4/dt05_multi_isolated_1ch_track/shape/speech_shape
  batch_type: numel
  batch_bins: 15000000
  data_type: [sound, text, chime4_label]
  num_workers: 4
