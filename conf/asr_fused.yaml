model: asr_model
model_conf:
  aux_loss_weight: 0.0
  model_repo: "moonshotai/Kimi-Audio-7B-Instruct"
  tokenizer_repo: "THUDM/glm-4-voice-tokenizer"
  sample_rate: 16000
  adapter_conf:
    expert_ffn_dim: 1280
    num_experts: 5
    top_k: 2
  asr_decoder_conf:
    dropout: 0.1

optimizer_conf:
  adam_beta1: 0.9
  adam_beta2: 0.95
  lr: 0.00005
  warmup_steps: 500
  stable_steps: 0
  min_lr_ratio: 0.3

token_type: char
token_list: conf/chime4_char_tokens.txt

patience: 10
seed: 314562
epoch: 30
log_every_n_steps: 500
task: asr
use_tensorboard: true
best_model_criterion:
  - ["valid/ctc_loss", "min", 5]

dataset_conf:
  train_data: chime4/tr05_all_noisy
  train_shape_file:
    - data/chime4/tr05_all_noisy/shape/fused_shape
  valid_data: chime4/dt05_multi_isolated_1ch_track
  valid_shape_file:
    - data/chime4/dt05_multi_isolated_1ch_track/shape/fused_shape
  batch_type: numel
  batch_bins: 30000000
  data_type: [fused, text, chime4_label]
  num_workers: 4
