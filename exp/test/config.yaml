model: test_model
model_conf:
    num_classes: 4
    aux_loss_weight: 0.1
    model_repo: moonshotai/Kimi-Audio-7B-Instruct
    tokenizer_repo: THUDM/glm-4-voice-tokenizer
    sample_rate: 16000
    adapter_conf:
        expert_ffn_dim: 1280
        num_experts: 8
        top_k: 4
    classfier_conf:
        classifier_hidden_dim: 1280
        dropout: 0.1
optimizer_conf:
    adam_beta1: 0.9
    adam_beta2: 0.95
    lr: 1.0e-05
    warmup_steps: 20
    stable_steps: 0
    min_lr_ratio: 0.1
dataset_conf:
    train_data: chime4/tr05_all_noisy
    train_shape_file:
    - /mnt/disk2/m11315045/MoE_Adapter/data/chime4/tr05_all_noisy/shape/speech_shape
    valid_data: chime4/dt05_multi_isolated_1ch_track
    valid_shape_file:
    - /mnt/disk2/m11315045/MoE_Adapter/data/chime4/dt05_multi_isolated_1ch_track/shape/speech_shape
    batch_bins: 15000000
    batch_size: 20
    batch_type: numel
    max_cache_size: 0.0
    max_cache_fd: 32
    num_iters_per_epoch: null
    allow_multi_rates: false
    iterator_type: sequence
    fold_lengths:
    - 80000
    - 150
    sort_in_batch: descending
    sort_batch: descending
    drop_last_iter: false
    train_dtype: float32
    shuffle_within_batch: false
    num_workers: 0
    data_type:
    - sound
    - chime4_label
seed: 314562
epoch: 10
log_every_n_steps: 1
task: classify
ngpu: 1
exp_tag: test
output_dir: exp/test
use_tensorboard: true
use_wandb: true
wandb_project: MoE_Adapter
wandb_name: test_run
best_model_criterion:
-   - valid/acc
    - max
    - 5
